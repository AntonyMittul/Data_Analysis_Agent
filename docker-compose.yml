version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datasense_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHON_VERSION=3.11.9
      - GEMINI_MODEL=gemini-3.1-flash-lite
      - EMBEDDING_MODEL=models/gemini-embedding-001
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass the backend URL to the frontend during build time
        - VITE_API_URL=http://localhost:8000
    container_name: datasense_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
